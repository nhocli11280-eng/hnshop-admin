plugins {
    id 'com.android.application'
}
def expectedCert = project.findProperty("expectedCertSha256") ?: ""
android {
    namespace 'vn.hnshop.admin'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.hnshop.admin'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
        buildConfigField 'String', 'EXPECTED_CERT_SHA256', '"' + expectedCert + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
