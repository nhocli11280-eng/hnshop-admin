plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.hnshop.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.hnshop.admin'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
