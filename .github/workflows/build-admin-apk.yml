name: Build HNShop Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-admin-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-admin
        run: gradle --no-daemon assembleDebug

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hnshop-admin-apk-${{ github.run_number }}
          name: HNShop Admin APK build ${{ github.run_number }}
          files: android-admin/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
