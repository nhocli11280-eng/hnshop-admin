name: Build HNShop Admin APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-android-admin.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Create temporary signing key and pin certificate
        working-directory: android-admin
        shell: bash
        run: |
          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -v -keystore hnshop-release.jks -storepass "$PASS" -keypass "$PASS" -alias hnshop -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HNShop Admin, OU=Mobile, O=HNShop, L=Vietnam, C=VN"
          echo "ANDROID_KEYSTORE=$GITHUB_WORKSPACE/android-admin/hnshop-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=hnshop" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          CERT_SHA=$(keytool -exportcert -alias hnshop -keystore hnshop-release.jks -storepass "$PASS" | openssl dgst -sha256 | awk '{print toupper($2)}')
          echo "EXPECTED_CERT_SHA=$CERT_SHA" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android-admin
        run: gradle --no-daemon assembleRelease -PexpectedCertSha256="$EXPECTED_CERT_SHA"
      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose android-admin/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs android-admin/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HNShop-Admin-Gaming-APK
          path: android-admin/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
